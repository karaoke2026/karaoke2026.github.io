<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Database Code Generator</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: #121212; color: #e0e0e0; padding: 40px 20px; }
        .panel { max-width: 700px; margin: 0 auto; background: #1e1e1e; border-radius: 12px; padding: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        h2 { margin-bottom: 20px; color: #fff; font-size: 22px; border-bottom: 2px solid #333; padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-size: 14px; color: #b3b3b3; }
        input { width: 100%; padding: 12px; background: #2a2a2a; border: 1px solid #444; border-radius: 6px; color: #fff; font-size: 15px; }
        input:focus { border-color: #ff0000; outline: none; }
        button { background: #ff0000; color: white; border: none; padding: 12px 20px; font-weight: 600; border-radius: 6px; cursor: pointer; width: 100%; font-size: 15px; }
        button:hover { background: #cc0000; }
        
        .output-box { display: none; background: #262626; padding: 20px; margin-top: 25px; border-radius: 6px; border-left: 4px solid #ff0000; }
        textarea { width: 100%; height: 70px; background: #121212; color: #00ff00; border: 1px solid #444; border-radius: 4px; padding: 10px; font-family: 'Courier New', Courier, monospace; font-size: 14px; resize: none; margin-top: 10px;}
        .instruction { font-size: 13px; color: #aaa; margin-top: 5px; }

        .list-item { display: flex; justify-content: space-between; align-items: center; background: #262626; padding: 10px; margin-top: 10px; border-radius: 6px; font-size: 14px; }
    </style>
</head>
<body>

<div class="panel">
    <h2>Generate New Track Code Entry</h2>
    <div class="form-group">
        <label>Song Title / Movie Name</label>
        <input type="text" id="songTitle" placeholder="e.g., Malare - Premam (Karaoke)">
    </div>
    <div class="form-group">
        <label>YouTube Link or Video ID</label>
        <input type="text" id="videoUrl" placeholder="e.g., https://youtube.com">
    </div>
    <button onclick="generateCode()">Generate Database Line</button>

    <!-- Results Block -->
    <div class="output-box" id="outputBox">
        <label style="color: #00ff00; font-weight: bold;">✓ Code Generated Successfully:</label>
        <textarea id="codeResult" readonly onclick="this.select()"></textarea>
        <p class="instruction"><strong>How to add:</strong> Click the green code above to highlight it, copy it, and paste it inside the square brackets <code>[ ]</code> of your <code>videos.js</code> file.</p>
    </div>

    <h2 style="margin-top: 40px;">Current Inventory Look-up</h2>
    <div id="manager-list">Loading lists...</div>
</div>

<script src="videos.js"></script>
<script>
    // Cleans and strips down full YouTube URLs into standard 11-digit IDs
    function extractVideoId(url) {
        const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
        const match = url.match(regExp);
        return (match && match.length === 11) ? match[2] : url;
    }

    function generateCode() {
        const title = document.getElementById('songTitle').value.trim();
        const rawUrl = document.getElementById('videoUrl').value.trim();
        const videoId = extractVideoId(rawUrl);

        if (!title || !videoId) {
            alert('Please fill out both inputs!');
            return;
        }

        // Builds the precise object string formatting line
        const codeLine = `    { title: "${title}", videoId: "${videoId}" },`;
        
        document.getElementById('codeResult').value = codeLine;
        document.getElementById('outputBox').style.display = 'block';
    }

    function loadCurrentInventory() {
        const listContainer = document.getElementById('manager-list');
        listContainer.innerHTML = '';

        if(typeof myVideos === 'undefined' || myVideos.length === 0) {
            listContainer.innerHTML = '<p style="color:#777;">No tracks found inside videos.js.</p>';
            return;
        }

        myVideos.forEach(video => {
            const row = document.createElement('div');
            row.className = 'list-item';
            row.innerHTML = `
                <div><strong>${video.title}</strong> <span style="color:#777;">(${video.videoId})</span></div>
                <div style="color: #ff5555; font-size:12px;">To remove: Delete this line from your videos.js file</div>
            `;
            listContainer.appendChild(row);
        });
    }

    loadCurrentInventory();
</script>
</body>
</html>
