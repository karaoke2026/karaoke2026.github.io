<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube Video Info</title>

<style>
body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f3f3;
    margin:30px;
}

.container{
    max-width:700px;
    margin:auto;
    background:#fff;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.15);
}

input{
    width:80%;
    padding:10px;
    font-size:16px;
}

button{
    padding:10px 18px;
    font-size:16px;
    cursor:pointer;
}

img{
    margin-top:20px;
    width:100%;
    max-width:480px;
    border-radius:8px;
}

.info{
    margin-top:20px;
    line-height:1.8;
}

label{
    font-weight:bold;
    color:#444;
}
</style>
</head>

<body>

<div class="container">

<h2>YouTube Video Information</h2>

<input type="text"
       id="videoId"
       placeholder="Enter YouTube Video ID"
       value="iQKFmL9uVGU">

<button onclick="loadVideo()">Load</button>

<br>

<img id="thumb">

<div class="info">

<p><label>Title:</label> <span id="title"></span></p>

<p><label>Channel:</label> <span id="channel"></span></p>

<p><label>Views:</label> <span id="views"></span></p>

<p><label>Published:</label> <span id="published"></span></p>

<p><label>Description:</label></p>
<div id="description"></div>

</div>

</div>

<script>

const API_KEY = "AIzaSyCE5Ok0e9IDA7_QoZNx16kSY63d5dDZj0Y";

async function loadVideo(){

    const videoId =
        document.getElementById("videoId").value.trim();

    if(videoId==""){
        alert("Enter a Video ID");
        return;
    }

    const url =
    `https://www.googleapis.com/youtube/v3/videos?part=snippet,statistics&id=${videoId}&key=${API_KEY}`;

    try{

        const response = await fetch(url);

        const json = await response.json();

        if(json.error){
            alert(json.error.message);
            return;
        }

        if(json.items.length==0){
            alert("Video not found.");
            return;
        }

        const v = json.items[0];

        document.getElementById("title").textContent =
            v.snippet.title;

        document.getElementById("channel").textContent =
            v.snippet.channelTitle;

        document.getElementById("views").textContent =
            Number(v.statistics.viewCount).toLocaleString();

        document.getElementById("published").textContent =
            new Date(v.snippet.publishedAt).toLocaleDateString();

        document.getElementById("description").textContent =
            v.snippet.description;

        document.getElementById("thumb").src =
            v.snippet.thumbnails.high.url;

    }
    catch(err){
        alert(err);
    }

}

// Load sample video on page load
loadVideo();

</script>

</body>
</html>
