<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malayalam Karaoke Playlist</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: #0f0f0f; color: #fff; padding: 24px; }
        .container { display: flex; flex-direction: row; max-width: 1400px; margin: 0 auto; gap: 24px; }
        
        /* Main Player Column */
        .main-player { flex: 2; min-width: 0; }
        .video-wrapper { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 12px; background: #000; }
        .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
        .video-title { margin-top: 16px; font-size: 20px; font-weight: 600; }

        /* Sidebar Playlist Column */
        .sidebar { flex: 1; max-height: 85vh; overflow-y: auto; background: #1f1f1f; border-radius: 12px; padding: 16px; }
        .sidebar h2 { font-size: 18px; margin-bottom: 16px; color: #aaa; border-bottom: 1px solid #333; padding-bottom: 8px; }
        .playlist-item { display: flex; gap: 12px; margin-bottom: 12px; padding: 8px; border-radius: 8px; cursor: pointer; transition: background 0.2s; }
        .playlist-item:hover { background: #383838; }
        .playlist-item.active { background: #272727; border: 1px solid #ff0000; }
        .thumb-wrapper { width: 120px; height: 68px; flex-shrink: 0; border-radius: 6px; overflow: hidden; background: #000; }
        .thumb-wrapper img { width: 100%; height: 100%; object-fit: cover; }
        .item-details { display: flex; flex-direction: column; justify-content: flex-start; }
        .item-title { font-size: 14px; font-weight: 500; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        @media (max-width: 900px) {
            .container { flex-direction: column; }
            .sidebar { max-height: none; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Left Column -->
	  <div class="main-player">

        <div class="video-title" id="player-title">Select a video to start singing...</div>

        const container = document.getElementById('playlist-container');
        container.innerHTML = '';

        if(typeof myVideos === 'undefined' || myVideos.length === 0) {

            return;
        }

        myVideos.forEach((video, index) => {
            const item = document.createElement('div');
            item.className = `playlist-item ${index === 0 ? 'active' : ''}`;
            
            // Fixed String Interpolation for the Thumbnail URL
            const thumbUrl = `https://img.youtube.com/vi/${video.videoId}/mqdefault.jpg`;
            
			
			
			// https://img.youtube.com/vi/u4Um49oQEL0/mqdefault.jpg
			
			
			
            item.innerHTML = `
                <div class="thumb-wrapper"><img src="${thumbUrl}" alt="thumbnail"></div>
                <div class="item-details"><div class="item-title">${video.title}</div></div>
            `;
            
            item.onclick = () => playVideo(video.videoId, video.title, video.fId, item);
            container.appendChild(item);

            // Autoplays or pre-loads the very first song on start
            if(index === 0) playVideo(video.videoId, video.title, video.fId, item);
        });
    }
